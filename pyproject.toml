[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dualpose"
version = "0.1.0"
description = "Dual-camera monocular 3D pose viewer for webcam + IP camera."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.10",
  "onnxruntime>=1.16",
  "rtmlib>=0.0.13",
  "scipy>=1.11",
  "PyYAML>=6.0",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
include = ["dualpose*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: marks tests that are slower or rely on downloaded model files",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
